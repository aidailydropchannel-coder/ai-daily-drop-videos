name: fetch-stock

on:
  push:
    paths:
      - "requests/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-stock
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download stock media from Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 engine/fetch_stock.py
